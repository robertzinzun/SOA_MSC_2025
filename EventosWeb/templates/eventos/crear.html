{% extends 'comunes/base.html' %}
{% block navbar %}
    {% include 'comunes/menu.html' %}
{% endblock %}
{% block principal %}
    <h1 class="bg bg-info">REGISTRAR EVENTO</h1>
    <form action="/eventos/registrar" method="post">
        <div class="form-group">
            <label>Nombre:</label>
            <input type="text" name="nombre" id="nombre" class="form-control" required placeholder="Nombre del Evento">
        </div>
        <div class="form-group">
            <label>Cantidad de Participante:</label>
            <input type="number" name="participantes" id="participantes" class="form-control" required placeholder="Participantes">
        </div>
        <div class="form-group">
            <label>Fecha de Incio:</label>
            <input type="date" name="fechaInicio" id="fechaInicio" class="form-control" required placeholder="Fecha inicio">
        </div>
        <div class="form-group">
            <label>Fecha Fin:</label>
            <input type="date" name="fechaFin" id="fechaFin" class="form-control" required placeholder="fechaFin">
        </div>
        <div class="form-group">
            <label>Descripción:</label>
            <input type="text" name="descripcion" id="descripcion" class="form-control" required placeholder="descripcion">
        </div>
        <div class="form-group">
            <label>Tipo:</label>
            <select name="idTipo">
                 <option value="0">-Elige un Tipo de Evento-</option>
                <!--
                {% if opciones %}
                {% for opcion in opciones %}
                    <option value="{{opcion['idOpcion']}}">{{opcion['nombre']}}</option>
                {% endfor %}
                {% endif %}
                -->
            </select>
        </div>
        <div class="form-group">
            <label>Departamento:</label>
            <select name="idDepartamento">
                 <option value="0">-Elige un Departamento-</option>
                <!--
                {% if opciones %}
                {% for opcion in opciones %}
                    <option value="{{opcion['idOpcion']}}">{{opcion['nombre']}}</option>
                {% endfor %}
                {% endif %}
                -->
            </select>
        </div>
        <button class="btn btn-primary" id="registrar"> <span class="glyphicon glyphicon-ok"></span> Registrar </button>
        <a class="btn btn-success" href="/eventos"> <span class="glyphicon glyphicon-arrow-left"></span> Regresar </a>
        {% if get_flashed_messages()%}
            {% for m in get_flashed_messages()%}
            <div class="alert alert-success alert-dismissible">
                <a href="#" class="close" data-dismiss="alert" aria-label="close">&times;</a>
                <strong>{{m}}</strong>
            </div>
            {% endfor %}
        {% endif %}
    </form>
{% endblock %}
